[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sectrace-mps"
version = "0.1.0"
description = "A graph-aware 100M-parameter security encoder and staged PyTorch training pipeline"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5,<3", "numpy>=1.26,<3", "PyYAML>=6,<7",
  "safetensors>=0.4,<1", "psutil>=5.9,<8", "scikit-learn>=1.4,<2"
]

[project.optional-dependencies]
data = ["tokenizers>=0.21,<1", "datasets>=3.3,<5", "huggingface-hub>=0.28,<2", "ijson>=3.3,<4"]
dev = ["pytest>=8,<10"]

[project.scripts]
sectrace = "sectrace.cli:main"

[tool.setuptools.packages.find]
include = ["sectrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
