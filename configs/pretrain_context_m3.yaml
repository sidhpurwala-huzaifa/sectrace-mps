# Continue on newly prepared 1024/2048-token caches with --init; optimizer resets.
model:
  preset: 100m
  max_length: 8192
  query_chunk: 64
  checkpoint_blocks: true
  dropout: 0.0
training:
  stage: pretrain
  seed: 17
  precision: auto
  microbatch_size: 1
  gradient_accumulation: 16
  max_steps: 20000
  target_tokens: 100000000
  learning_rate: 0.00005
  warmup_steps: 500
  weight_decay: 0.1
  graph_dropout: 0.1
  evaluate_every: 500
  validation_max_samples: 1000
  log_every: 10
  keep_checkpoints: 3
  mps_memory_fraction: 0.85
