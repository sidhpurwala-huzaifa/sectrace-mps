model:
  preset: 100m
  max_length: 8192
  query_chunk: 128
  checkpoint_blocks: true
  dropout: 0.05
training:
  stage: align
  seed: 17
  precision: auto
  microbatch_size: 1
  gradient_accumulation: 16
  max_steps: 4000
  learning_rate: 0.000005
  head_lr_multiplier: 1.0
  warmup_steps: 100
  weight_decay: 0.01
  clip_norm: 1.0
  graph_dropout: 0.1
  evaluate_every: 100
  validation_max_samples: 4000
  evaluation_batch_size: 1
  early_stopping_patience: 8
  log_every: 10
  keep_checkpoints: 3
  mps_memory_fraction: 0.85
  loss_weights:
    risk: 1.0
    positive_weight: 1.0
    cwe: 0.15
    family: 0.05
    roles: 0.75
    edges: 0.5
    adequacy: 0.75
    pair: 0.5
    pair_margin: 1.0
    teacher: 0.0
